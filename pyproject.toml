[project]
name = "cs336_basics"
version = "26.0.0"
description = "CS336 Assignment 1"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8",      # tensor operations
    "einx>=0.4",        # more general tensor operations
    "jaxtyping>=0.3",   # type hints for pytorch/jax/numpy
    "numpy>=2.4",
    "psutil>=7",
    "plotext>=5.3",
    "pytest>=9.0",
    "pytest-timeout",
    "regex>=2026.3.32", # more powerful regex than the builtin `re` module
    "tiktoken>=0.12.0",
    "torch~=2.11.0",
    "tqdm>=4.67",
    "tensorboard>=2.20",
    "ty>=0.0.26",
    "ruff>=0.15.8",
]

[project.scripts]
train-bpe = "cs336_basics.bpe_cli:main"
train-lm = "cs336_basics.train_lm:main"
llm-bench = "cs336_basics.bench:main"

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.12"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.source-dir = "source"
build-dir = "build/{wheel_tag}"
logging.level = "DEBUG"
wheel.packages = ["cs336_basics"]
wheel.install-dir = "cs336_basics"

[tool.scikit-build.cmake.define]
CMAKE_CXX_STANDARD = "20"
CMAKE_CXX_STANDARD_REQUIRED = "ON"
CMAKE_EXPORT_COMPILE_COMMANDS = "ON"
CMAKE_POSITION_INDEPENDENT_CODE = "ON"
BUILD_TESTING = "OFF"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"

[tool.ruff]
line-length = 120

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]

[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["F722"]
